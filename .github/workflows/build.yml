name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update
      - run: sudo apt-get install -y fakeroot dpkg-dev desktop-file-utils
      - run: npm ci
      - run: node --check lib/cli.js
      - run: desktop-file-validate packaging/debian/codex-plusplus-linux.desktop
      - run: scripts/build-deb.sh
      - run: dpkg-deb --info dist/codex-plusplus-linux_0.1.0_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: codex-plusplus-linux-deb
          path: dist/codex-plusplus-linux_0.1.0_amd64.deb
